        }

            const content = document.getElementById('ai-content');
            modal.classList.remove('hidden');
            content.innerHTML = '<div class="flex items-center gap-3 text-purple-600 font-semibold p-4"><svg class="animate-spin h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> กำลังส่งข้อมูลให้ Gemini AI วิเคราะห์แผนการเรียนของคุณ กรุณารอสักครู่...</div>';

            let totalCr = 0, passedCr = 0, enrolledCr = 0;
            let enrolledList = [], unlockedList = [], lockedList = [];

            courses.forEach(c => {
                totalCr += c.credit;
                if (c.status === 'passed') passedCr += c.credit;
                else if (c.status === 'enrolled') {
                    enrolledCr += c.credit;
                    enrolledList.push(`- ${getDisplayCode(c)} ${getDisplayName(c)} (${c.credit} หน่วยกิต)`);
                } else {
                    if (isPrereqMet(c.prereqs)) {
                        unlockedList.push(`- ${getDisplayCode(c)} ${getDisplayName(c)} (${c.credit} หน่วยกิต)`);
                    } else {
                        let missing = c.prereqs.filter(pId => {
                            let p = courses.find(x => x.id === pId);
                            return !p || p.status !== 'passed';
                        });
                        lockedList.push(`- ${c.id} (ติดเงื่อนไขต้องผ่าน: ${missing.join(', ')})`);
                    }
                }
            });

            const promptText = `คุณคือที่ปรึกษาทางวิชาการภาควิชาวิศวกรรมโยธา มหาวิทยาลัยเชียงใหม่

- หน่วยกิตที่เก็บได้แล้ว: ${passedCr} / ${totalCr}
- หน่วยกิตที่กำลังเรียนเทอมนี้: ${enrolledCr}

📝 วิชาที่กำลังเรียนอยู่เทอมนี้:
${enrolledList.length > 0 ? enrolledList.join('\n') : '- ไม่มี'}

🟢 วิชาที่ปลดล็อคแล้ว (สามารถลงเรียนเทอมหน้าได้):

🔒 วิชาบังคับที่ยังติดเงื่อนไข (ลงไม่ได้):

คำสั่ง:

2. แนะนำ "ตารางเรียนสำหรับเทอมถัดไป" ให้ชัดเจน โดยหยิบวิชาจากกลุ่ม "ปลดล็อคแล้ว" มาจัดให้เหมาะสม (รวมประมาณ 15-18 หน่วยกิต) เน้นวิชาที่เป็นตัวต่อ (Critical Chain) ก่อนเพื่อไม่ให้ติดล็อคในปีถัดไป
3. ให้คำแนะนำเพิ่มเติมในการเก็บวิชาที่เหลือให้จบตามเป้าหมาย

ตอบเป็นภาษาไทยด้วยน้ำเสียงให้กำลังใจ เป็นมืออาชีพ และจัดหัวข้อให้อ่านง่าย`;

            try {
                // แก้ไขการเรียกใช้งานเป็นโมเดลเวอร์ชันใหม่ gemini-3.6-flash ตามคำแนะนำของ Google 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message || "API Key ไม่ถูกต้องหรือมีข้อผิดพลาด");
                }

                const aiReply = data.candidates[0].content.parts[0].text;
                content.innerHTML = marked.parse(aiReply);

                content.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg"><b>เกิดข้อผิดพลาด:</b> ${err.message}<br><br><span class="text-xs">แนะนำให้ตรวจสอบว่าเปิดใช้ API Key จาก Google AI Studio ถูกต้องหรือไม่ครับ</span></div>`;
            }
        }

        function closeModal() {
            document.getElementById('ai-modal').classList.add('hidden');
        }

        function exportData() {
            const dataStr = JSON.stringify(courses, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "my_cmu_course_plan.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported) && imported.length > 0 && imported[0].hasOwnProperty('id')) {
                        defaultCourses.forEach(defCourse => {
                            let found = imported.find(imp => imp.id === defCourse.id);
                            if (!found && defCourse.id === "CE 499") found = imported.find(imp => imp.id === "CE 499 (1)");
                            if (!found && defCourse.id === "CE 411") found = imported.find(imp => imp.id === "CE 411 (1)");
                            if (!found && defCourse.id === "CE 461") found = imported.find(imp => imp.id === "CE 461 (1)");

                            if (found) {
                                const index = courses.findIndex(c => c.id === defCourse.id);
                                if (index > -1) {
                                    courses[index].status = found.status || 'pending';
                                    courses[index].grade = found.grade || '-';
                                    if(found.customCode) courses[index].customCode = found.customCode;
                                    if(found.customName) courses[index].customName = found.customName;
                                    if(found.plannedTerm !== undefined) courses[index].plannedTerm = found.plannedTerm;
                                }
                            }
                        });

                        saveToStorage();
                        render();
                        alert("โหลดข้อมูลสำเร็จครับ!");
                    } else {
                        alert("รูปแบบไฟล์ไม่ถูกต้องครับ");
                    }
                } catch (err) {
                    alert("เกิดข้อผิดพลาดในการอ่านไฟล์");
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            const btnCat = document.getElementById('btn-view-category');
            const btnTerm = document.getElementById('btn-view-term');
            const btnPlan = document.getElementById('btn-view-myplan');
            const baseClass = "flex-1 md:flex-none px-3 py-2 text-sm font-medium transition-colors ";
            
            if (mode === 'category') {
                btnCat.className = baseClass + "border rounded-l-lg tab-active";
                btnTerm.className = baseClass + "border-y border-r tab-inactive";
                btnPlan.className = baseClass + "border-y border-r rounded-r-lg tab-inactive bg-indigo-50 text-indigo-700 hover:bg-indigo-100";
            } else if (mode === 'term') {
                btnCat.className = baseClass + "border rounded-l-lg tab-inactive";
                btnTerm.className = baseClass + "border-y border-r tab-active";
                btnPlan.className = baseClass + "border-y border-r rounded-r-lg tab-inactive bg-indigo-50 text-indigo-700 hover:bg-indigo-100";
            } else if (mode === 'myplan') {
                btnCat.className = baseClass + "border rounded-l-lg tab-inactive";
                btnTerm.className = baseClass + "border-y border-r tab-inactive";
                btnPlan.className = baseClass + "border-y border-r rounded-r-lg bg-indigo-600 text-white border-indigo-600";
            }
            render();
        }

        function isPrereqMet(prereqs) {
            if (prereqs.length === 0) return true;
            return prereqs.every(prereqId => {
                const course = courses.find(c => c.id === prereqId);
                return course && course.status === "passed";
            });
        }

        function updateCourse(id, field, value) {
            const courseIndex = courses.findIndex(c => c.id === id);
            if (courseIndex > -1) {
                courses[courseIndex][field] = value;
                if(field === 'status' && value !== 'passed') {
                    resetDependentCourses(id);
                }
                saveToStorage();
                render();
            }
        }

        function resetDependentCourses(prereqId) {
            courses.forEach(course => {
                if(course.prereqs.includes(prereqId)) {
                    if (course.status === 'passed' || course.status === 'enrolled') {
                        course.status = "pending";
                        course.grade = "-";
                        resetDependentCourses(course.id);
                    }
                }
            });
        }

        function resetData() {
            if(confirm("ล้างแผนการเรียนทั้งหมดและเริ่มใหม่?")) {
                localStorage.removeItem('cmuCivilPlannerV19');
                courses = JSON.parse(JSON.stringify(defaultCourses));
                render();
            }
        }

        function getDisplayName(course) {
            return course.customName ? course.customName : course.name;
        }
        
        function getDisplayCode(course) {
            return course.customCode ? course.customCode : (course.code !== "-" ? course.code : course.id);
        }

        function render() {
            updateSummary();
            const container = document.getElementById('course-list');
            container.innerHTML = '';

            let groups = [];
            
            if (currentViewMode === 'category') {
                groups = categoryOrder.filter(cat => courses.some(c => c.category === cat));
            } else if (currentViewMode === 'term') {
                groups = [...new Set(courses.map(c => c.term))];
            } else if (currentViewMode === 'myplan') {
                const rawGroups = [...new Set(courses.filter(c => c.status !== 'passed').map(c => c.plannedTerm || 'ไม่ได้ระบุเทอม (Unplanned)'))];
                groups = rawGroups.sort((a, b) => {
                    if (a.includes('Unplanned')) return 1;
                    if (b.includes('Unplanned')) return -1;
                    const matchA = a.match(/(\d+)\/(\d+)/);
                    const matchB = b.match(/(\d+)\/(\d+)/);
                    if (matchA && matchB) {
                        if (matchA[2] !== matchB[2]) return parseInt(matchA[2]) - parseInt(matchB[2]);
                        return parseInt(matchA[1]) - parseInt(matchB[1]);
                    }
                    return a.localeCompare(b);
                });
            }

            groups.forEach(groupName => {
                const groupSection = document.createElement('div');
                let headerColor = 'bg-slate-200/50 border-slate-500 text-slate-800';
                
                if (currentViewMode === 'category') headerColor = 'bg-indigo-100/60 border-indigo-500 text-indigo-900';
                if (currentViewMode === 'myplan') {
                    headerColor = groupName.includes('Unplanned') ? 'bg-gray-100 border-gray-400 text-gray-500' : 'bg-blue-100 border-blue-500 text-blue-900';
                }
                
                let titleName = groupName;
                if (currentViewMode === 'myplan' && !groupName.includes('Unplanned')) titleName = `📌 แผนการเรียน: ${groupName}`;

                const filteredCourses = courses.filter(c => {
                    if (currentViewMode === 'category') return c.category === groupName;
                    if (currentViewMode === 'term') return c.term === groupName;
                    if (currentViewMode === 'myplan') {
                        if (c.status === 'passed') return false; 
                        return (c.plannedTerm || 'ไม่ได้ระบุเทอม (Unplanned)') === groupName;
                    }
                });

                groupSection.innerHTML = `<h2 class="text-xl font-bold mb-4 p-3 rounded-lg border-l-4 shadow-sm ${headerColor} flex justify-between items-center">
                    <span>${titleName}</span>

                        bgStyle = 'bg-gray-100 opacity-60';

                        bgStyle = 'bg-amber-50 border-amber-300';

                    infoDiv.className = "w-full xl:w-2/3 pr-4";

                        infoDiv.innerHTML = `

                            </div>
                            <input type="text" placeholder="พิมพ์ชื่อวิชาที่เลือกลงที่นี่..." value="${course.customName || ''}" onchange="updateCourse('${course.id}', 'customName', this.value)" class="w-full text-sm font-semibold text-blue-700 bg-blue-50 border border-blue-300 rounded px-2 py-1 outline-none focus:bg-white focus:ring-2 focus:ring-blue-400 placeholder-gray-400 transition-colors">
                            <div class="text-xs text-slate-400 mt-1">หมวด: ${course.name}</div>

                        planInput.onchange = (e) => updateCourse(course.id, 'plannedTerm', e.target.value);
                        controlsDiv.appendChild(planInput);
                    }

                    const statusSelect = document.createElement('select');
                    statusSelect.className = "p-2 border rounded-lg text-sm w-full xl:w-auto bg-white disabled:bg-gray-200 cursor-pointer outline-none focus:ring-2 focus:ring-blue-400";
                    statusSelect.disabled = !canTake;
                    statusSelect.innerHTML = `
                        <option value="pending" ${course.status === 'pending' ? 'selected' : ''}>⏳ ยังไม่เรียน</option>
                        <option value="enrolled" ${course.status === 'enrolled' ? 'selected' : ''}>📝 กำลังเรียน</option>
                        <option value="passed" ${course.status === 'passed' ? 'selected' : ''}>✅ ผ่านแล้ว</option>
                        <option value="failed" ${course.status === 'failed' ? 'selected' : ''}>❌ ไม่ผ่าน / ถอน</option>
                    `;
                    statusSelect.onchange = (e) => updateCourse(course.id, 'status', e.target.value);

                    const gradeSelect = document.createElement('select');
                    gradeSelect.className = "p-2 border rounded-lg text-sm bg-white disabled:bg-gray-200 cursor-pointer outline-none focus:ring-2 focus:ring-blue-400";
                    gradeSelect.disabled = !canTake || course.status === 'pending' || course.status === 'enrolled';
                    
                    grades.forEach(g => {
                        gradeSelect.innerHTML += `<option value="${g}" ${course.grade === g ? 'selected' : ''}>${g}</option>`;
                    });
                    gradeSelect.onchange = (e) => updateCourse(course.id, 'grade', e.target.value);

                    controlsDiv.appendChild(statusSelect);
                    controlsDiv.appendChild(gradeSelect);

                    card.appendChild(infoDiv);
                    card.appendChild(controlsDiv);
                    grid.appendChild(card);
                });

                if (filteredCourses.length > 0) {
                    groupSection.appendChild(grid);
                    container.appendChild(groupSection);
                }
            });
        }

        render();
    </script>
</body>
</html>
